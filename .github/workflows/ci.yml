# The pipeline (ADR 0008 to ADR 0011): every change goes through the same
# stages, and an image is published only when everything before it passed.
#
#   lint ──► tests ─────┐   API on SQLite and Postgres, worker, Telegram
#                       │   end to end, docker compose smoke test
#   lock files ─────────┴─► images (api, web, worker) ──► pipeline passed
#                                                             │ main only
#                                                          release
#                                                             │ a new version only
#                                                    production check
#
# On a Pull Request the images are only built, to check they build. On main
# they are published to GHCR as `sha-<commit>`; when the merge adds a version
# to releases.toml, `release` also tags them with it (`1.4.2`) and creates the
# GitHub release, and the server puts the newest version in production by
# itself (docs/DEPLOY.md); "production check" then waits until production runs
# it and checks it, read-only (ADR 0011). "pipeline passed" is the one check
# branch protection needs to require.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  # Mondays: rebuild and republish every image from main. The official base
  # images (python, caddy) get Alpine and Debian security fixes under the same
  # tag, and without a rebuild they would never reach the server. New base
  # versions come from Dependabot, as Pull Requests.
  schedule:
    - cron: "0 9 * * 1"  # Mondays 06:00 in São Paulo
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a Pull Request replaces the run still going. On main runs go
# one at a time, so an older run can never publish after a newer one
# (a run still waiting is skipped when a newer merge arrives: the newer one
# includes its changes).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Mistakes a machine can spot before any test runs (ruff.toml says which).
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: api/.python-version
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      # ruff comes from the API's dev lock file, hash-checked: the same version
      # as in a developer's .venv.
      - name: Install ruff
        run: pip install --require-hashes "--only-binary=:all:" -r api/requirements-dev.txt

      - name: Python (ruff)
        run: ruff check --output-format=github .

      # shellcheck comes with GitHub's Ubuntu runners.
      - name: Shell scripts (shellcheck)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # releases.toml is right and README.md says its newest version (ADR 0010).
      # On a Pull Request it also refuses a version lower than main's, and says
      # whether merging releases a new version (which then goes to production).
      - name: Versions (releases.toml)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=
          if [ -n "$BASE_REF" ] && git fetch -q --depth=1 origin "$BASE_REF"; then
            if git show FETCH_HEAD:releases.toml > "$RUNNER_TEMP/main-releases.toml" 2>/dev/null; then
              base=$(python3 -I .github/scripts/releases.py --version --file "$RUNNER_TEMP/main-releases.toml")
            elif git cat-file -e FETCH_HEAD:VERSION 2>/dev/null; then
              base=$(git show FETCH_HEAD:VERSION)  # main before ADR 0010
            fi
          fi
          python3 -I .github/scripts/releases.py ${base:+--base "$base"}

  tests:
    # The same suite on SQLite (fast) and on real Postgres, which catches what
    # SQLite does not: 32-bit integers, NUL characters, row locks...
    name: pytest (${{ matrix.database }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test_database_url: ""
          - database: postgres
            test_database_url: postgresql+psycopg://slicepizza:slicepizza@localhost:5432/slicepizza_test
    services:
      postgres:
        # An empty image skips the service, so only the postgres leg starts it.
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: slicepizza
          POSTGRES_PASSWORD: slicepizza
          POSTGRES_DB: slicepizza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U slicepizza -d slicepizza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: api/.python-version  # the image's Python (checked below)
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        # The same rules as the image: only the versions and hashes in the lock file, wheels only.
        run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.txt

      - name: Run tests
        working-directory: api
        run: pytest -q

  lock-files:
    # requirements*.txt are generated from requirements*.in. If someone edits an .in file
    # and forgets to regenerate, the image would not get the change: fail here instead.
    # api/ and worker/ each have their own lock files, checked the same way.
    name: lock files up to date (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v7

      # The lock files are resolved for one Python version, the one in <service>/.python-version.
      # Dependabot bumps the FROM line of the Dockerfile on its own, so a new Python in the
      # image must fail here until .python-version and the lock files follow it.
      - name: Same Python in the image and in .python-version
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          want="$(cat "$SERVICE/.python-version")"
          if ! grep -Eq "^FROM python:${want}-slim([@ ]|\$)" "$SERVICE/Dockerfile"; then
            echo "::error file=$SERVICE/Dockerfile::The FROM line of $SERVICE/Dockerfile is not python:${want}-slim ($SERVICE/.python-version). Update .python-version and regenerate the lock files (see $SERVICE/README.md#dependencies)."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version-file: ${{ matrix.service }}/.python-version

      - name: Regenerate the lock files
        run: ${{ matrix.service }}/scripts/compile-requirements.sh

      # Comment lines are ignored (the header and the "# via" notes depend on the pip-tools
      # version, and Dependabot runs its own); package versions, markers and hashes must match.
      # The script takes every hash from PyPI again, so a hash edited by hand shows up here.
      - name: Compare with the committed ones
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if ! git diff --exit-code --ignore-matching-lines='^[[:space:]]*#' -- "$SERVICE/requirements*.txt"; then
            echo "::error::$SERVICE/requirements*.txt are out of date. Run $SERVICE/scripts/compile-requirements.sh (see $SERVICE/README.md#dependencies) and commit the result."
            exit 1
          fi

  worker-tests:
    # The worker's unit tests, plus its integration tests against a real RabbitMQ, the
    # same version as docker-compose.yml (RABBITMQ_TEST_HOST turns them on).
    name: pytest (worker)
    needs: lint
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: slicepizza
          RABBITMQ_DEFAULT_PASS: slicepizza
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      RABBITMQ_TEST_HOST: localhost
      RABBITMQ_TEST_USER: slicepizza
      RABBITMQ_TEST_PASSWORD: slicepizza
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: worker/.python-version
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        working-directory: worker
        # The same rules as the image: only the versions and hashes in the lock file, wheels only.
        run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.txt

      - name: Run tests
        working-directory: worker
        run: pytest -q

  telegram-e2e:
    # A customer follows their order on Telegram, end to end (ADR 0006): the real API
    # (Postgres, RabbitMQ) and the real worker, against a fake Telegram Bot API that
    # injects /start and /stop and records every message the bot sends.
    name: Telegram opt-in, end to end
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slicepizza
          POSTGRES_PASSWORD: slicepizza
          POSTGRES_DB: slicepizza_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U slicepizza -d slicepizza_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: slicepizza
          RABBITMQ_DEFAULT_PASS: slicepizza
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      INTERNAL_API_TOKEN: ci-internal-token-0123456789abcdef0123456789
      KITCHEN_API_TOKEN: ci-kitchen-token-0123456789abcdef0123456789
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: slicepizza
      RABBITMQ_PASSWORD: slicepizza
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: api/.python-version

      - name: Install the API and the worker (lock files, hashes checked)
        run: |
          python -m venv /tmp/api-venv
          /tmp/api-venv/bin/pip install --quiet --require-hashes "--only-binary=:all:" -r api/requirements.txt
          python -m venv /tmp/worker-venv
          /tmp/worker-venv/bin/pip install --quiet --require-hashes "--only-binary=:all:" -r worker/requirements.txt

      - name: Start the fake Telegram, the API and the worker
        run: |
          nohup python3 .github/scripts/fake_telegram.py 8081 > fake-telegram.log 2>&1 &
          cd api
          POSTGRES_HOST=localhost POSTGRES_USER=slicepizza POSTGRES_PASSWORD=slicepizza POSTGRES_DB=slicepizza_e2e \
            nohup /tmp/api-venv/bin/uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          cd ../worker
          TELEGRAM_BOT_TOKEN=123:ci TELEGRAM_API_URL=http://127.0.0.1:8081 TELEGRAM_PIZZERIA_CHAT_ID=-100999 \
            API_URL=http://127.0.0.1:8000 \
            nohup /tmp/worker-venv/bin/python -m app.main > ../worker.log 2>&1 &
          sleep 3

      - name: Follow an order on Telegram
        run: python3 .github/scripts/e2e_telegram_optin.py

      - name: Logs
        if: always()
        run: |
          echo "--- API"; cat api.log
          echo "--- worker"; cat worker.log
          echo "--- fake Telegram"; cat fake-telegram.log

  docker-smoke:
    name: docker compose smoke test
    needs: lint
    runs-on: ubuntu-latest
    env:
      # Built into the images (docker-compose.yml), checked below.
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          # The version the images are built with (docker-compose.yml), checked below.
          echo "APP_VERSION=$(python3 -I .github/scripts/releases.py --version)" >> "$GITHUB_ENV"
          cp .env.example .env
          # A bot username, so the check below sees Caddy fill it into config.js.
          echo "TELEGRAM_BOT_USERNAME=CiPizzeriaBot" >> .env
          # The kitchen login (ADR 0007). KITCHEN_PASSWORD is only for the checks
          # below; the containers get its hash, made the way .env.example says.
          echo "KITCHEN_API_TOKEN=$(openssl rand -hex 32)" >> .env
          echo "KITCHEN_PASSWORD=ci-kitchen-password" >> .env
          echo "KITCHEN_PASSWORD_HASH=$(printf 'ci-kitchen-password\nci-kitchen-password\n' \
            | docker run --rm -i caddy:2.11.8-alpine sh -c 'caddy hash-password | base64 -w0')" >> .env

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait for health
        run: docker compose up -d --wait

      - name: Check health and menu
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/menu
          # The API's private metrics (ADR 0012), on its own port; through Caddy
          # they answer 404 (checked below).
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^slicepizza_build_info{'

      # The way customers come in: Caddy on 8080 serves the site and forwards /api to the API.
      - name: Check the site and the API through Caddy
        run: |
          # No folder is mounted over /srv (docker-compose.yml), so these are
          # the files inside the web image, as published.
          curl -fsS http://127.0.0.1:8080/ | grep -q "Pizzeria"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "SLICEPIZZA_CONFIG"
          curl -fsS http://127.0.0.1:8080/config.js | grep -q "apiUrl"
          # config.js is a template: Caddy fills in the bot for "Follow on Telegram".
          curl -fsS http://127.0.0.1:8080/config.js | grep -q "telegramBot: 'CiPizzeriaBot'"
          curl -fsSI http://127.0.0.1:8080/config.js | grep -qi "^content-type: text/javascript"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/menu > /dev/null
          # Both report the commit they were built from (ADR 0008), and the
          # version number (releases.toml, ADR 0010).
          test "$(curl -fsS http://127.0.0.1:8080/version)" = "$GIT_COMMIT"
          curl -fsS http://127.0.0.1:8080/api/health | grep -q "\"version\":\"$GIT_COMMIT\""
          curl -fsS http://127.0.0.1:8080/api/health | grep -q "\"release\":\"$APP_VERSION\""
          curl -fsS http://127.0.0.1:8080/api/openapi.json | grep -q "\"version\":\"$APP_VERSION\""
          docker compose logs worker | grep -q "Starting version $APP_VERSION (commit $GIT_COMMIT)"
          # The pages' version history, made from releases.toml inside the image.
          curl -fsS http://127.0.0.1:8080/releases.json \
            | python3 -I -c 'import json, os, sys; d = json.load(sys.stdin); assert d["version"] == os.environ["APP_VERSION"] and d["releases"], d'
          curl -fsSI http://127.0.0.1:8080/releases.json | grep -qi "^content-type: application/json"
          # The interactive docs must load their schema through the /api prefix.
          curl -fsS http://127.0.0.1:8080/api/docs | grep -q "/api/openapi.json"
          curl -fsS http://127.0.0.1:8080/api/openapi.json > /dev/null
          # The worker-only /internal routes must never be reachable through Caddy (ADR 0006).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/internal/orders/x/telegram-subscriptions/1)" = 404
          # Same for the metrics: they stay on the project network (ADR 0012).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/metrics)" = 404

      - name: Check the kitchen login (ADR 0007)
        run: |
          set -a; . ./.env; set +a
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # The board and its calls need the login...
          test "$(code http://127.0.0.1:8080/kitchen/)" = 401
          test "$(code -u "kitchen:wrong" http://127.0.0.1:8080/kitchen/)" = 401
          test "$(code http://127.0.0.1:8080/kitchen/api/orders)" = 401
          curl -fsS -u "kitchen:$KITCHEN_PASSWORD" http://127.0.0.1:8080/kitchen/ | grep -q "Pizzeria kitchen"
          curl -fsS -u "kitchen:$KITCHEN_PASSWORD" http://127.0.0.1:8080/kitchen/kitchen.js > /dev/null
          curl -fsS -u "kitchen:$KITCHEN_PASSWORD" http://127.0.0.1:8080/kitchen/api/orders | grep -q '^\['
          # ...and the public /api can neither list orders nor change them, even
          # with the kitchen's login (only the token Caddy adds works).
          test "$(code http://127.0.0.1:8080/api/orders)" = 401
          test "$(code -u "kitchen:$KITCHEN_PASSWORD" http://127.0.0.1:8080/api/orders)" = 401
          test "$(code -X PATCH -H 'Content-Type: application/json' -d '{"status":"preparing"}' \
            http://127.0.0.1:8080/api/orders/00000000-0000-0000-0000-000000000000/status)" = 401

      # Caddy refuses to start with an empty or malformed hash; the image's start
      # script must turn only the kitchen off, never the whole site.
      - name: Check that a bad kitchen setting can't take the site down
        run: |
          for hash in "" "not-a-hash" '$2a$14$too-short'; do
            docker run -d --name web-check -p 18080:8080 -e API_UPSTREAM=127.0.0.1:9 \
              -e KITCHEN_PASSWORD_HASH="$hash" -e KITCHEN_USERNAME= slicepizza-web
            for i in $(seq 1 10); do curl -fs -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done
            curl -fsS http://127.0.0.1:18080/ | grep -q "Pizzeria"
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/kitchen/)" = 404
            docker rm -f web-check
          done
          curl -fsS -X POST http://127.0.0.1:8080/api/orders \
            -H "Content-Type: application/json" \
            -d '{"customer":{"name":"CI","phone":"+55 11 90000-0000","address":"Rua do Teste, 1"},"items":[{"pizza_id":1,"quantity":1}]}'

      # A new order and a status change reach a queue bound to the events exchange,
      # in order, with the right message properties (ADR 0004).
      - name: Check that order events reach RabbitMQ
        run: |
          set -a; . ./.env; set +a
          python3 .github/scripts/smoke_order_events.py

      # Phase 3's "done when": with the worker down, messages wait in its queue and are
      # handled when it comes back.
      - name: Check that messages wait for the worker
        run: |
          set -a; . ./.env; set +a
          python3 .github/scripts/smoke_worker_down.py

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  images:
    # Only after everything above passed: a commit that fails a check never
    # becomes an image the server could run.
    name: image (${{ matrix.name }})
    needs: [lint, lock-files, tests, worker-tests, telegram-e2e, docker-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            file: api/Dockerfile
          - name: web
            context: .
            file: infra/caddy/Dockerfile
          - name: worker
            context: worker
            file: worker/Dockerfile
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/senatoreteam/slicepizza-${{ matrix.name }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file }}
      # Publish from main only: never from a Pull Request, nor from a manual
      # run on another branch.
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  pipeline-passed:
    # The single check for branch protection: green only when every job above
    # is. (A skipped or cancelled job counts as a failure.)
    name: pipeline passed
    if: always()
    needs: [lint, lock-files, tests, worker-tests, telegram-e2e, docker-smoke, images]
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A stage of the pipeline did not pass ($result)."
              exit 1
            fi
          done

  release:
    # A merge that adds a version to releases.toml publishes it (ADR 0009,
    # ADR 0010): the images this run just tested get the version's tag,
    # nothing is rebuilt, and the GitHub release vX.Y.Z is written from it.
    # The server sees the new version and puts it in production by itself.
    # Not on the Monday rebuild: a version's tag never moves.
    name: release
    needs: pipeline-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the release and its tag
      packages: write  # the version's tag on the images
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the version, if it is new
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release.sh

  production-check:
    # After a new version is published, the server installs it by itself within
    # a few minutes (ADR 0009). This waits until production runs it and checks
    # it like a visitor would, read-only, so the run on GitHub says whether the
    # version went live (ADR 0011). GitHub never reaches the server and holds no
    # secret for it: it only looks at the public site. Red after 15 minutes
    # means the server did not install it, or put the previous one back.
    name: production check
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # A GitHub environment with no secrets: the repository's Deployments page
    # lists each version that went live, and when.
    environment:
      name: production
      url: https://slicepizza.senatore.tech
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Wait for the version, then check production (read-only)
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: python3 -I .github/scripts/check_deploy.py https://slicepizza.senatore.tech "$GITHUB_SHA" --release "$VERSION" --timeout 900
