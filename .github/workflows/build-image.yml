# Builds one Docker image; called by the pipeline (ci.yml) once for each image,
# after the lint and the tests passed (ADR 0008). With `push`, it publishes
# `sha-<commit>` to GHCR; the pipeline's `release` job adds the version's tag
# when releases.toml gets a new version (ADR 0009). Without it, it only checks
# the image builds.
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name, e.g. ghcr.io/senatoreteam/slicepizza-api
        required: true
        type: string
      context:
        description: Build context folder
        required: true
        type: string
      file:
        description: Path to the Dockerfile
        required: true
        type: string
      push:
        description: Publish the image (main only); otherwise just build it
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.image }}
          # No `latest`: the server runs numbered versions (ADR 0009).
          tags: |
            type=sha

      # The newest version in releases.toml (ADR 0010), built into the images:
      # /api/health, the API docs, the worker's log and the pages say it.
      - name: Version
        id: version
        run: echo "version=$(python3 -I .github/scripts/releases.py --version)" >> "$GITHUB_OUTPUT"

      # Phase 8 (ADR 0021): scan the image before anything is published. The image is
      # built once into the local Docker (layers come from the cache), scanned with Trivy
      # (HIGH and CRITICAL with a fix available, plus secrets left in the image), and
      # only then built again for real, which is a cache hit. An accepted finding goes
      # in .trivyignore.yaml with a reason and an expiry date.
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: scan-target:local
          cache-from: type=gha,scope=${{ inputs.image }}

      - name: Scan the image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore.yaml --exit-code 1 scan-target:local

      - name: Build (and publish, from main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          # Always check for a newer base image under the same tag (security fixes).
          pull: true
          push: ${{ inputs.push }}
          # The commit, reported by /api/health, /version and the worker's log,
          # and the version number.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per image, so the images don't evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
