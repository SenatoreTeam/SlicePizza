# Builds one Docker image; called by the pipeline (ci.yml) once for each image,
# after the lint and the tests passed (ADR 0008). With `push`, it publishes the
# image to GHCR as `sha-<commit>` (full and short); the deploy jobs then move
# `staging` and `latest` to it (ADR 0009). Without it, it only checks the
# image builds.
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name, e.g. ghcr.io/senatoreteam/slicepizza-api
        required: true
        type: string
      context:
        description: Build context folder
        required: true
        type: string
      file:
        description: Path to the Dockerfile
        required: true
        type: string
      push:
        description: Publish the image (main only); otherwise just build it
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          # Only commit tags. `staging` and `latest` (production) are moved by the
          # deploy jobs, after the checks: an image is never live just because
          # it was built.
          tags: |
            type=sha,format=long
            type=sha

      - name: Build (and publish, from main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          # Always check for a newer base image under the same tag (security fixes).
          pull: true
          push: ${{ inputs.push }}
          # The commit, reported by /api/health, /version and the worker's log.
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per image, so the images don't evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
