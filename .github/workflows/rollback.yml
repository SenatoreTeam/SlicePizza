# Puts an earlier version back in production (ADR 0009): moves the `latest`
# tag to the images of the commit you give, deploys and checks it, the same
# way the pipeline does. Actions tab → "Roll back production" → Run workflow.
#
# Use the full commit of a version whose pipeline passed on main (only those
# have images). Staging is left as it is. The next merge into main deploys
# forward again, so fix or revert the bad change before merging anything else.
name: Roll back production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit (40 characters) to put back in production
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: roll back (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://slicepizza.senatore.tech
    # Shared with the pipeline's production deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The input goes through the environment, never into the script's text.
      - name: Point :latest at that commit and deploy
        env:
          COMMIT: ${{ inputs.commit }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: .github/scripts/deploy.sh latest "$COMMIT"

      - name: Check production
        env:
          COMMIT: ${{ inputs.commit }}
        run: python3 -I .github/scripts/check_deploy.py https://slicepizza.senatore.tech "$COMMIT"
