# SlicePizza's versions, newest first (ADR 0010). The single source of:
#   - the version: a merge that adds a version at the top publishes it, and the server
#     puts it in production (docs/DEPLOY.md#releasing-a-version);
#   - the GitHub release of each version, written by the pipeline from this file;
#   - the "Current version" line of README.md (the lint checks they match).
#
# To release a version, add a [[release]] block at the TOP, above the newest one:
#
#   [[release]]
#   version = "1.1.0"                  # MAJOR.MINOR.PATCH, higher than the one below
#   date = 2026-11-20                  # the day it is merged
#   title.en = "Pizzas can be marked as sold out"      # optional, one sentence
#   title.pt-br = "Pizzas podem ser marcadas como esgotadas"
#
#   [[release.item]]                   # one per change, in the words of the people who use it
#   kind = "new"                       # new | improvement | fix | security
#   area = "Menu"                      # Menu | Orders | Kitchen | Telegram | System
#   text.en = "The kitchen can mark a pizza as sold out, and the menu hides it until it is back."
#   text.pt-br = "A cozinha pode marcar uma pizza como esgotada, e o cardápio a esconde até ela voltar."
#
# An update proposed by Dependabot adds `source = "dependabot"` and `pr = <its number>`: the
# release says "(Dependabot, #N)", so the project's own changes and Dependabot's are told apart.
# Security fixes say that something was fixed, never how to exploit it.

[[release]]
version = "1.6.4"
date = 2026-11-24
title.en = "The API closes a half-open RabbitMQ connection"
title.pt-br = "A API fecha uma conexão com o RabbitMQ que ficou pela metade"

[[release.item]]
kind = "fix"
area = "System"
text.en = "When the API could not finish setting up its connection to RabbitMQ, it left that connection open and opened a new one on every retry. It now closes it before trying again. Order updates reach Telegram as before."
text.pt-br = "Quando a API não conseguia terminar de preparar a sua conexão com o RabbitMQ, deixava essa conexão aberta e abria outra a cada nova tentativa. Agora ela a fecha antes de tentar de novo. As atualizações dos pedidos chegam ao Telegram como antes."

[[release]]
version = "1.6.1"
date = 2026-11-24
title.en = "FastAPI update"
title.pt-br = "Atualização do FastAPI"

[[release.item]]
kind = "improvement"
area = "System"
text.en = "The API's web framework, FastAPI, is updated from 0.162.6 to 0.163.1. The new version brings FastAPI's own bug fixes; nothing changes for customers or the kitchen."
text.pt-br = "O framework web da API, o FastAPI, foi atualizado de 0.162.6 para 0.163.1. A nova versão traz correções do próprio FastAPI; nada muda para os clientes nem para a cozinha."
source = "dependabot"
pr = 110

[[release]]
version = "1.6.0"
date = 2026-11-21
title.en = "A stuck order queue shows in the health check"
title.pt-br = "Uma fila de pedidos travada aparece no health check"

[[release.item]]
kind = "improvement"
area = "System"
text.en = "`/api/health` now says whether order updates are reaching Telegram: `outbox` is `late` when an update has waited more than 5 minutes, so a monitor can warn before customers notice."
text.pt-br = "O `/api/health` agora diz se as atualizações dos pedidos estão chegando ao Telegram: `outbox` fica `late` quando uma atualização espera mais de 5 minutos, para um monitor avisar antes de os clientes notarem."

[[release.item]]
kind = "improvement"
area = "System"
text.en = "Every change is now checked for test coverage, and is refused if it would leave less of the code tested than today."
text.pt-br = "Toda mudança agora tem a cobertura de testes verificada, e é recusada se deixar menos do código testado do que hoje."

[[release]]
version = "1.5.0"
date = 2026-11-21
title.en = "Your data, treated with more care"
title.pt-br = "Seus dados, tratados com mais cuidado"

[[release.item]]
kind = "security"
area = "Orders"
text.en = "The link to follow an order no longer shows the customer's name, phone or address, so forwarding it does not reveal who ordered or where. The order page says \"Delivering to the address you gave us\"."
text.pt-br = "O link para acompanhar um pedido não mostra mais o nome, o telefone nem o endereço do cliente, então encaminhá-lo não revela quem pediu nem onde. A página do pedido diz \"Entregando no endereço que você informou\"."

[[release.item]]
kind = "security"
area = "System"
text.en = "Names, phones and addresses of old orders are now replaced 12 months after the order ends (and Telegram chat links 7 days after), keeping only the items and totals. The pizzeria can also answer a customer who asks what we keep or asks to be erased."
text.pt-br = "Nomes, telefones e endereços de pedidos antigos agora são trocados 12 meses depois que o pedido termina (e os vínculos do Telegram 7 dias depois), ficando só os itens e os valores. A pizzaria também pode atender um cliente que pergunta o que guardamos ou pede para ser apagado."

[[release.item]]
kind = "security"
area = "Menu"
text.en = "The site no longer loads fonts from Google, so a visitor's address is not sent to a third party just for opening the menu."
text.pt-br = "O site não carrega mais fontes do Google, então o endereço de quem visita não é enviado a terceiros só por abrir o cardápio."

[[release.item]]
kind = "security"
area = "System"
text.en = "Search engines no longer index the API or the kitchen board. Every GitHub automation step and every base image is now pinned to an exact, checked version."
text.pt-br = "Os buscadores não indexam mais a API nem o painel da cozinha. Cada etapa de automação do GitHub e cada imagem base agora é fixada em uma versão exata e conferida."

[[release]]
version = "1.4.0"
date = 2026-11-19
title.en = "Safer against abuse"
title.pt-br = "Mais protegido contra abusos"

[[release.item]]
kind = "security"
area = "Orders"
text.en = "Placing orders is limited to 30 per minute from one address, so a script cannot flood the kitchen and Telegram. Customers ordering normally will not notice."
text.pt-br = "Fazer pedidos é limitado a 30 por minuto vindos de um mesmo endereço, para que um script não inunde a cozinha e o Telegram. Quem pede normalmente não vai notar."

[[release.item]]
kind = "security"
area = "System"
text.en = "Every image is now checked for known security problems and for forgotten secrets before it is published, and the whole history of the code is scanned for secrets. Unneeded tools were removed from the images and the web server was updated."
text.pt-br = "Cada imagem agora é conferida atrás de problemas de segurança conhecidos e de segredos esquecidos antes de ser publicada, e todo o histórico do código é varrido atrás de segredos. Ferramentas desnecessárias foram removidas das imagens e o servidor web foi atualizado."

[[release]]
version = "1.3.0"
date = 2026-11-19
title.en = "Ready for a busy Friday"
title.pt-br = "Pronto para uma sexta movimentada"

[[release.item]]
kind = "improvement"
area = "Menu"
text.en = "The menu can be served from a short-lived cache when the server has one, so it opens faster when many people look at it at once. Without the cache, nothing changes."
text.pt-br = "O cardápio pode ser servido de um cache de curta duração quando o servidor tem um, e abre mais rápido quando muita gente olha ao mesmo tempo. Sem o cache, nada muda."

[[release.item]]
kind = "improvement"
area = "System"
text.en = "The system can run several copies of the order service and share the requests among them, so one copy restarting does not interrupt customers. The server keeps running one copy until it is told otherwise."
text.pt-br = "O sistema pode rodar várias cópias do serviço de pedidos e dividir as requisições entre elas, então uma cópia reiniciando não interrompe os clientes. O servidor continua com uma cópia até que se diga o contrário."

[[release]]
version = "1.2.1"
date = 2026-11-19
title.en = "Monitoring is the server's own"
title.pt-br = "O monitoramento é do servidor"

[[release.item]]
kind = "improvement"
area = "System"
text.en = "The API no longer reports its own numbers at a private address: the server's monitoring, shared by every project on it, already watches the system. Nothing changes for customers or the kitchen."
text.pt-br = "A API não informa mais os próprios números em um endereço privado: o monitoramento do servidor, compartilhado por todos os projetos dele, já acompanha o sistema. Nada muda para os clientes nem para a cozinha."

[[release]]
version = "1.2.0"
date = 2026-11-17
title.en = "The API reports how it is doing"
title.pt-br = "A API informa como ela está"

[[release.item]]
kind = "new"
area = "System"
text.en = "The API now reports its own numbers (orders created, requests, errors, how fast it answers, and order events waiting to be sent), for the monitoring that comes next. They are not public and hold no customer data."
text.pt-br = "A API agora informa seus próprios números (pedidos criados, requisições, erros, a rapidez das respostas e eventos de pedido esperando para serem enviados), para o monitoramento que vem a seguir. Eles não são públicos e não contêm dados de clientes."

[[release]]
version = "1.1.1"
date = 2026-11-17
title.en = "Each new version is checked in production"
title.pt-br = "Cada versão nova é conferida na produção"

[[release.item]]
kind = "improvement"
area = "System"
text.en = "After a new version goes live, the pipeline waits for production to report it and checks the site, reading only, so no test order reaches the kitchen."
text.pt-br = "Depois que uma versão nova entra no ar, o pipeline espera a produção informar a versão e confere o site, só lendo, para nenhum pedido de teste chegar à cozinha."

[[release]]
version = "1.1.0"
date = 2026-11-17
title.en = "The version and what's new, in the system"
title.pt-br = "A versão e as novidades, no próprio sistema"

[[release.item]]
kind = "new"
area = "Kitchen"
text.en = "The kitchen board shows the version at the bottom, and What's new lists what changed in each version. After an update, a notice says a new version is live until What's new is opened."
text.pt-br = "O painel da cozinha mostra a versão no rodapé, e o What's new lista o que mudou em cada versão. Depois de uma atualização, um aviso diz que há versão nova até o What's new ser aberto."

[[release.item]]
kind = "improvement"
area = "Menu"
text.en = "The menu site shows the version at the bottom, with a link to what changed in it."
text.pt-br = "O site do cardápio mostra a versão no rodapé, com um link para o que mudou nela."

[[release.item]]
kind = "improvement"
area = "System"
text.en = "The API's health check and its docs say the version, and the notification worker logs it when it starts."
text.pt-br = "A verificação de saúde da API e a documentação dela dizem a versão, e o worker de notificações a registra no log ao iniciar."

[[release]]
version = "1.0.0"
date = 2026-11-17
title.en = "The first numbered version"
title.pt-br = "A primeira versão numerada"

[[release.item]]
kind = "new"
area = "Menu"
text.en = "The menu site at `/` and the Orders API at `/api`, on one domain."
text.pt-br = "O site do cardápio em `/` e a API de pedidos em `/api`, num domínio só."

[[release.item]]
kind = "new"
area = "Telegram"
text.en = "Telegram messages for the pizzeria about each order, and for the customers who follow their order."
text.pt-br = "Mensagens no Telegram para a pizzaria sobre cada pedido, e para os clientes que acompanham o seu."

[[release.item]]
kind = "new"
area = "Kitchen"
text.en = "The kitchen board at `/kitchen`, behind a login."
text.pt-br = "O painel da cozinha em `/kitchen`, com login."

[[release.item]]
kind = "improvement"
area = "System"
text.en = "Numbered versions: production runs the newest released version, instead of every change merged."
text.pt-br = "Versões numeradas: a produção roda a versão publicada mais nova, e não cada mudança que entra."
