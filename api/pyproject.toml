[tool.pytest.ini_options]
# The ``app`` package is imported from the api/ directory, so make sure it is
# on sys.path even when pytest is invoked through its console script.
pythonpath = ["."]
testpaths = ["tests"]
# Any warning fails the tests, so a deprecation shows up in the PR that causes
# it (often a Dependabot PR) instead of piling up. "error" and not
# "error::DeprecationWarning": Starlette's StarletteDeprecationWarning is a
# UserWarning, and that is how httpx's deprecation went unnoticed (issue #24).
# To accept a warning on purpose, add a narrow "ignore:<message>:<Category>"
# line below with a comment saying why.
#
# Accepted: pika 1.5.0 warns that BlockingConnection (app/outbox.py) will be
# removed in pika 2.0. It still works in 1.5.x; moving to pika.Connection is its
# own change, needed before pika 2.0 (requirements.in caps pika at <2.0). The
# filter matches the message, as pika's upgrade notes suggest; worker/ has the
# same one. tests/test_events.py builds the real
# publisher, so any other warning from pika still fails the tests.
filterwarnings = [
    "error",
    "ignore:.*will be removed in Pika 2\\.0:DeprecationWarning",
]

# Test coverage (roadmap 10.4). CI runs `pytest -q --cov`; locally add --cov
# to see the report. fail_under is a floor, not a goal: 87% when this was added (SQLite leg, 2026-11-21).
# Raise it when coverage goes up; never lower it to make a PR pass
# (see "Test coverage" in api/README.md).
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
