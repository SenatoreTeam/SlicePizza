# Prometheus for SlicePizza (Phase 5, ADR 0013). It reads the numbers of each
# service on the project network; none of these ports is public.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The API's own numbers: requests, latency, orders, outbox backlog (ADR 0012).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # RabbitMQ's built-in exporter (the rabbitmq_prometheus plugin, on by default
  # in the official image): queue depth, consumers, connections.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Prometheus itself, so "is the monitoring alive" is a number too.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
