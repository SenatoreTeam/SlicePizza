# Alert rules (ADR 0015). Each one is "a number crossed a line for a few
# minutes", so a blip does not wake anyone up.
apiVersion: 1
groups:
  - orgId: 1
    name: slicepizza
    folder: SlicePizza
    interval: 1m
    rules:
      - uid: api-down
        title: API is down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: Prometheus cannot read /metrics from the API for 2 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: 'min(up{job="api"})', instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions: [{ evaluator: { type: lt, params: [1] } }]
      - uid: api-5xx
        title: API returns many 5xx errors
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 5% of API requests failed with 5xx for 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(slicepizza_http_requests_total{status=~"5.."}[5m])) / sum(rate(slicepizza_http_requests_total[5m]))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
      - uid: outbox-stuck
        title: Orders are not reaching the kitchen
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: The oldest outbox event has waited more than 5 minutes (the worker or RabbitMQ is stuck).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { expr: 'max(slicepizza_outbox_oldest_pending_age_seconds)', instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions: [{ evaluator: { type: gt, params: [300] } }]
      - uid: queue-backlog
        title: RabbitMQ queue is backing up
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: More than 50 messages have been waiting in a queue for 10 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { expr: 'max(rabbitmq_queue_messages_ready)', instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions: [{ evaluator: { type: gt, params: [50] } }]
      - uid: error-logs
        title: Many error lines in the logs
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: The API logged more than 20 error lines in 5 minutes.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            queryType: instant
            model:
              expr: 'sum(count_over_time({service="api"} |~ "(?i)error|exception|traceback" [5m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions: [{ evaluator: { type: gt, params: [20] } }]
