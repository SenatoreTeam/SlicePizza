<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen | Zé's Pizzeria</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1E5B3F">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="kitchen.css">
  <script src="kitchen.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1 class="bar-title">Zé's Pizzeria kitchen</h1>
    <p id="updated" class="bar-status" aria-live="off">Loading orders…</p>
    <button id="logout" class="bar-button" type="button" hidden>Log out</button>
  </header>

  <!-- Shown when this browser is not logged in (ADR 0024). -->
  <form id="login" class="login" hidden>
    <h2 class="login-title">Kitchen login</h2>
    <label class="login-label" for="password">Password</label>
    <input id="password" class="login-input" name="password" type="password"
           autocomplete="current-password" required maxlength="200">
    <p id="login-problem" class="login-problem" role="alert" hidden></p>
    <button id="login-submit" class="btn btn-go" type="submit">Log in</button>
    <p class="login-note">You stay logged in for 12 hours on this device.</p>
  </form>

  <p id="problem" class="problem" role="alert" hidden></p>
  <!-- After an update, until "What's new" is opened in this browser. -->
  <p id="new-version" class="notice notice-version" role="status" hidden>
    <span id="new-version-text"></span>
    <button id="new-version-open" class="link-button" type="button">See what changed</button>
  </p>
  <p id="notice" class="notice" role="status" hidden></p>
  <!-- Read out by screen readers when tickets arrive or leave. -->
  <p id="announce" class="visually-hidden" aria-live="polite"></p>

  <main id="board" class="board">
    <section class="rail" data-status="received" aria-labelledby="rail-received">
      <h2 class="rail-title" id="rail-received">New <span class="rail-count" data-count></span></h2>
      <ol class="tickets" data-tickets></ol>
      <p class="rail-empty" data-empty hidden>No new orders.</p>
    </section>
    <section class="rail" data-status="preparing" aria-labelledby="rail-preparing">
      <h2 class="rail-title" id="rail-preparing">In the oven <span class="rail-count" data-count></span></h2>
      <ol class="tickets" data-tickets></ol>
      <p class="rail-empty" data-empty hidden>Nothing in the oven.</p>
    </section>
    <section class="rail" data-status="out_for_delivery" aria-labelledby="rail-out_for_delivery">
      <h2 class="rail-title" id="rail-out_for_delivery">On the way <span class="rail-count" data-count></span></h2>
      <ol class="tickets" data-tickets></ol>
      <p class="rail-empty" data-empty hidden>No orders on the way.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="version"></span>
    <button id="whats-new-open" class="link-button" type="button" hidden>What's new</button>
  </footer>

  <!-- What changed in each version (releases.toml, ADR 0010), from /releases.json. -->
  <dialog id="whats-new" class="whats-new" aria-labelledby="whats-new-title">
    <div class="whats-new-head">
      <h2 id="whats-new-title" class="whats-new-title">What's new</h2>
      <button id="whats-new-close" class="link-button" type="button">Close</button>
    </div>
    <div id="whats-new-list"></div>
  </dialog>
</body>
</html>
